# Network configuration (software messages over trusted LAN, TCP + length-prefixed JSON).
# NOTE: this is NOT a real Sub-GHz OOB radio link; OOB is simulated in software.
protocol_version: 1
laptop_a: {host: "192.168.1.54", port: 9001}
laptop_b: {host: "192.168.1.39", port: 9002}   # B listens for feedback from A (bind address)
laptop_c: {host: "192.168.1.42", port: 9003}   # C listens for telemetry
max_message_bytes: 1048576
connect_timeout_s: 3.0
idle_timeout_s: 30.0        # B closes a feedback connection that is silent this long
reconnect_interval_s: 2.0
run:
  seed: 42
  duration_s: 30
  output_dir: results
  status_interval_s: 1.0
  log_level: INFO