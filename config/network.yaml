# Shared network configuration (trusted local network only).
# Messages are real TCP between laptops; radio/OOB behaviour is SIMULATED.
protocol_version: 1
laptop_c:
  bind_host: "0.0.0.0"          # listen on all LAN interfaces; firewall to trusted LAN only
  telemetry_port_a: 9101        # Laptop A -> C telemetry
  telemetry_port_b: 9102        # Laptop B -> C telemetry
laptop_a:
  host: "192.168.1.101"         # placeholder: replace with Laptop A LAN IP
laptop_b:
  host: "192.168.1.102"         # placeholder: replace with Laptop B LAN IP
limits:
  max_message_bytes: 1048576    # 1 MiB cap per framed message
  read_timeout_s: 30.0          # idle read timeout per connection
stale_after_s: 5.0              # peer marked STALE if no message for this long
dedupe_window: 10000            # remembered message IDs per peer
max_clock_skew_s: 300.0         # reject messages with timestamps too far in the future
